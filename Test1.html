DOCTYPE html>
<html>
<head>
    <title>Video and Audio Player</title>
</head>
<body>

    <h2>My Video</h2>

    <video width="350" controls>
        <source src="https://www.youtube.com/watch?v=xYk8FYbaWZU" type="video/mp4">
    </video>

    <h2>My Audio</h2>

    <audio controls>
        <source src="https://www.youtube.com/watch?v=xYk8FYbaWZU" type="audio/mpeg">
    </audio>

</body>
</html>
