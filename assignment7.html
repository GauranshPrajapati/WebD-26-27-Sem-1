<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 7 - Navigation Menu</title>
    <style>
        ul.nav {
            list-style-type: none;
            margin: 0;
            padding: 15px;
            background-color: #333;
            overflow: hidden;
        }
        ul.nav li {
            display: inline;
            margin-right: 30px;
        }
        ul.nav li a {
            color: white;
            text-decoration: none;
            font-family: serif;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <ul class="nav">
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Courses</a></li>
        <li><a href="#">Contact</a></li>
    </ul>
</body>
</html>
