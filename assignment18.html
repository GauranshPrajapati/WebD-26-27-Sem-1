<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 18 - Student Admission Page</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; }
        header, footer { background-color: #1a237e; color: white; text-align: center; padding: 20px; }
        table, th, td { border: 1px solid #b0bec5; border-collapse: collapse; padding: 8px; text-align: center; }
        table { margin: 0 auto; width: 60%; background-color: #f8f9fa; }
        th { background-color: #e8eaf6; }
        main { padding: 20px; }
        fieldset { width: 60%; margin: 20px auto; }
    </style>
</head>
<body>
    <header>
        <h1>ABC College Admission 2026</h1>
    </header>

    <main>
        <section>
            <h2 style="text-align: center;">Courses and Fees</h2>
            <p style="text-align: center;">Available Courses</p>
            <table>
                <thead>
                    <tr>
                        <th>Course</th>
                        <th>Seats</th>
                        <th>Fees</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>B.Tech CSE</td>
                        <td>120</td>
                        <td>&#8377;90,000</td>
                    </tr>
                    <tr>
                        <td>BCA</td>
                        <td>60</td>
                        <td>&#8377;45,000</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <section>
            <form action="submit.php" method="POST">
                <fieldset>
                    <legend>Application Form</legend>
                    <p>
                        <label for="name">Name:</label><br>
                        <input type="text" id="name" name="name" required style="width: 95%;">
                    </p>
                    <p>
                        <label for="email">Email:</label><br>
                        <input type="email" id="email" name="email" required style="width: 95%;">
                    </p>
                    <p>
                        <label for="course-select">Course:</label><br>
                        <select id="course-select" name="course">
                            <option value="btech">B.Tech CSE</option>
                            <option value="bca">BCA</option>
                        </select>
                    </p>
                    <p>
                        <label for="statement">Statement:</label><br>
                        <textarea id="statement" name="statement" rows="5" style="width: 95%;"></textarea>
                    </p>
                    <p>
                        <button type="submit">Apply</button>
                    </p>
                </fieldset>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 ABC College</p>
    </footer>
</body>
</html>
